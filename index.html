<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的任务</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="header-top">
        <p class="eyebrow" data-text="eyebrow">个人工作台</p>
        <div id="languages" role="group" data-label="language">
          <button type="button" data-language="zh" lang="zh-CN" aria-pressed="true">中文</button>
          <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
        </div>
      </div>
      <h1 data-text="pageTitle">我的任务</h1>
      <p data-text="intro">把要做的事记下来，一件一件完成。</p>
    </header>

    <section class="stats" data-label="stats" aria-live="polite">
      <div class="card"><span data-text="total">任务总数</span><strong id="total">0</strong></div>
      <div class="card"><span data-text="done">已完成</span><strong id="completed">0</strong></div>
    </section>

    <section class="card workspace" aria-labelledby="form-title">
      <h2 id="form-title">添加新任务</h2>
      <form id="task-form">
        <input id="task-title" data-label="taskName" required>
        <div class="form-fields">
          <div class="form-field">
            <label for="task-priority" data-text="priority">优先级</label>
            <select id="task-priority" name="priority">
              <option value="high" data-text="high">高</option>
              <option value="medium" data-text="medium" selected>中</option>
              <option value="low" data-text="low">低</option>
            </select>
          </div>
          <div class="form-field">
            <label for="task-due-date" data-text="dueDate">截止日期</label>
            <input id="task-due-date" type="date" max="9999-12-31">
          </div>
        </div>
        <div class="form-field">
          <label for="source-language" data-text="sourceLanguage">原文语言</label>
          <select id="source-language">
            <option value="" data-text="detect">自动识别</option>
            <option value="zh" lang="zh-CN">中文</option>
            <option value="en" lang="en">English</option>
          </select>
        </div>
        <button id="clear-due-date" type="button" data-text="clearDate" hidden>清除日期</button>
        <button class="primary" id="submit-task">添加任务</button>
        <button type="button" id="cancel-edit" data-text="cancel" hidden>取消编辑</button>
      </form>
      <div class="backup-actions">
        <button id="export-tasks" type="button" data-text="exportTasks">导出任务</button>
        <button id="import-tasks" type="button" data-text="importTasks">导入任务</button>
        <input id="backup-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="notice" role="status" hidden></p>

      <div class="list-header">
        <h2 data-text="list">任务列表</h2>
        <div id="filters" class="filters" role="group" data-label="filters">
          <button type="button" data-filter="all" data-text="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="active" data-text="active" aria-pressed="false">未完成</button>
          <button type="button" data-filter="done" data-text="done" aria-pressed="false">已完成</button>
        </div>
      </div>
      <ul id="task-list"></ul>
      <p id="empty" class="empty"></p>
    </section>
  </main>
</body>
</html>
