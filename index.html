<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的任务</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">个人工作台</p>
      <h1>我的任务</h1>
      <p>把要做的事记下来，一件一件完成。</p>
    </header>

    <section class="stats" aria-label="任务统计" aria-live="polite">
      <div class="card"><span>任务总数</span><strong id="total">0</strong></div>
      <div class="card"><span>已完成</span><strong id="completed">0</strong></div>
    </section>

    <section class="card workspace" aria-labelledby="form-title">
      <div class="form-heading">
        <h2 id="form-title">添加新任务</h2>
        <span class="form-tag" aria-hidden="true">优先级</span>
      </div>
      <form id="task-form">
        <input id="task-title" aria-label="任务名称" placeholder="请输入任务名称…" required>
        <div class="priority-picker" role="group" aria-labelledby="priority-label">
          <span id="priority-label">选择优先级：</span>
          <div class="priority-options">
            <label><input type="radio" name="priority" value="high"><span class="priority priority-high">高</span></label>
            <label><input type="radio" name="priority" value="medium" checked><span class="priority priority-medium">中</span></label>
            <label><input type="radio" name="priority" value="low"><span class="priority priority-low">低</span></label>
          </div>
        </div>
        <button class="primary" id="submit-task">＋ 添加任务</button>
        <button type="button" id="cancel-edit" hidden>取消编辑</button>
      </form>
      <p id="notice" role="status" hidden></p>

      <div class="list-header">
        <h2>任务列表</h2>
        <div id="filters" class="filters" role="group" aria-label="筛选任务">
          <button type="button" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="active" aria-pressed="false">未完成</button>
          <button type="button" data-filter="done" aria-pressed="false">已完成</button>
        </div>
      </div>
      <ul id="task-list"></ul>
      <p id="empty" class="empty"></p>
    </section>
  </main>
</body>
</html>
